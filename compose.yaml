services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: db_autofill_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d db_autofill_test"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - ./test/fixtures/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
